<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROMAN Restaurant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f0e5;
      color: #3b2418;
    }

    header {
      background: #4b2e20;
      color: #fff8ed;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    nav a {
      color: #fff8ed;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;

      background:
        linear-gradient(rgba(59,36,24,.65), rgba(59,36,24,.65)),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80");

      background-size: cover;
      background-position: center;
    }

    .hero-content {
      color: white;
      max-width: 650px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
      letter-spacing: 3px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #c79a62;
      color: white;
      padding: 14px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      margin: 5px;
    }

    .btn:hover {
      background: #a87842;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    .title {
      font-size: 34px;
      margin-bottom: 35px;
      color: #4b2e20;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .food {
      background: #fffaf2;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
    }

    .food img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .food-content {
      padding: 18px;
    }

    .food h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #a87842;
      font-weight: bold;
      font-size: 18px;
    }

    .about {
      background: #ead8c0;
    }

    .contact {
      background: #4b2e20;
      color: #fff8ed;
    }

    footer {
      background: #291810;
      color: #ddd;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      nav {
        display: none;
      }

      .hero h1 {
        font-size: 42px;
      }

      .hero p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ROMAN</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#menu">Menu</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero" id="home">
  <div class="hero-content">
    <h1>ROMAN</h1>

    <p>
      Delicious food, unforgettable moments.
    </p>

    <a href="#menu" class="btn">View Menu</a>
    <a href="#contact" class="btn">Reserve Table</a>
  </div>
</section>

<section id="menu">

  <h2 class="title">Our Menu</h2>

  <div class="menu">

    <div class="food">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80">
      <div class="food-content">
        <h3>Classic Burger</h3>
        <p>Fresh beef burger with cheese.</p>
