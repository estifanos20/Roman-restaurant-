<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROMAN Restaurant</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,"Noto Sans Ethiopic",sans-serif;
background:#f7efe3;
color:#3b2418;
}
header{
background:#4b2e1e;
color:white;
padding:15px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}
.logo{font-size:30px;font-weight:bold}
nav{margin:12px 0}
nav a{
color:white;
text-decoration:none;
margin:5px;
font-size:14px;
}
button{
background:#c68b4a;
color:white;
border:0;
padding:11px 16px;
border-radius:7px;
cursor:pointer;
margin:4px;
}
.hero{
text-align:center;
padding:90px 20px;
color:white;
background:
linear-gradient(#0008,#0008),
url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80")
center/cover;
}
.hero h1{font-size:52px;margin:10px}
.hero p{font-size:20px}
section{padding:45px 20px}
.title{text-align:center;font-size:30px}
.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1100px;
margin:auto;
}
.food{
background:white;
border-radius:12px;
overflow:hidden;
text-align:center;
box-shadow:0 3px 12px #0002;
}
.food img{
width:100%;
height:180px;
object-fit:cover;
}
.food-content{padding:15px}
.price{
color:#a65f24;
font-size:20px;
font-weight:bold;
margin:10px;
}
.about{
background:#ead8c1;
text-align:center;
}
.form{
max-width:550px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 3px 12px #0002;
}
input,textarea,select{
width:100%;
padding:13px;
margin:7px 0 14px;
border:1px solid #ddd;
border-radius:7px;
}
textarea{height:90px}
.contact{text-align:center}
.map{
width:100%;
height:300px;
border:0;
border-radius:12px;
}
.cart{
position:fixed;
right:15px;
bottom:15px;
background:#4b2e1e;
color:white;
padding:15px 20px;
border-radius:50px;
z-index:2000;
cursor
